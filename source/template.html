<meta charset="utf-8">
<title>Mandarin Word Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Noto+Serif+SC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EAEFEB; --ink:#16201C; --muted:#5B6863; --line:#D8DFDA;
  --accent:#0C7560; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8; --mark:#FFE9A8; --mark-ink:#16201C;
  --star:#C0392B;
  --t1:#C8372D; --t2:#B86E00; --t3:#1D8547; --t4:#2E5CC2; --t5:#7B8782;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 6px 20px rgba(22,32,28,.06);
  --hanzi:"Noto Serif SC","Songti SC","SimSun",serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#172019; --surface-2:#1E2925; --ink:#E6ECE9; --muted:#9BA8A2; --line:#2A3632;
    --accent:#40C3A1; --accent-ink:#06231C; --accent-soft:#16352D; --mark:#5A4A12; --mark-ink:#FFF4CF;
    --star:#FF7A6B;
    --t1:#FF7B6E; --t2:#F0B04A; --t3:#5BD08A; --t4:#80A6FF; --t5:#98A39E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#172019; --surface-2:#1E2925; --ink:#E6ECE9; --muted:#9BA8A2; --line:#2A3632;
  --accent:#40C3A1; --accent-ink:#06231C; --accent-soft:#16352D; --mark:#5A4A12; --mark-ink:#FFF4CF;
  --star:#FF7A6B;
  --t1:#FF7B6E; --t2:#F0B04A; --t3:#5BD08A; --t4:#80A6FF; --t5:#98A39E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* ---------- rail ---------- */
.rail{border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 40px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.seal{width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--hanzi);font-weight:700;font-size:22px;flex:none}
.brand h1{font-size:17px;margin:0;line-height:1.2;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.unit{margin-top:14px}
.unit-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:6px 10px;font-weight:700}
.ch-btn{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.ch-btn:hover{background:var(--surface-2)}
.ch-btn[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.ch-btn[aria-current="true"] .ch-num{color:var(--accent)}
.ch-num{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px}
.ch-zh{font-family:var(--zh);font-size:15px}
.ch-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.star-link .ch-num{color:var(--star)}

/* ---------- main ---------- */
main{padding-block:26px 80px;padding-inline:clamp(16px,4vw,48px);max-width:1080px;width:100%}
.mobile-nav{display:none}
.ch-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin-bottom:18px}
.ch-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
.ch-title{font-family:var(--hanzi);font-size:clamp(30px,4.4vw,44px);font-weight:700;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.ch-sub{color:var(--muted);font-size:17px}
.ch-stats{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--shadow)}
.search{flex:1 1 200px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35}
.chip[aria-pressed="true"] .dot{opacity:1}
.tb-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:14px 2px 6px;font-size:13px;color:var(--muted)}
.legend b{font-weight:700;font-size:15px}
.notice{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.notice strong{color:var(--ink)}

/* ---------- word list ---------- */
.list{display:grid;gap:12px;margin-top:14px}
.group-h{margin:22px 2px 0;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:10px;align-items:center}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.word{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:6px 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative}
.w-left{display:flex;flex-direction:column;gap:4px;min-width:0}
.w-hz-row{display:flex;align-items:center;gap:10px}
.hz{font-family:var(--hanzi);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:.02em;overflow-wrap:anywhere}
.py{font-size:18px;font-weight:600;letter-spacing:.01em}
.py span{white-space:nowrap}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.mean{font-size:16px;color:var(--ink)}
.w-right{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:34px}
.ex-row{display:flex;gap:10px;align-items:flex-start}
.ex{font-family:var(--zh);font-size:18px;line-height:1.7}
.ex mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.ex-en{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:4px;width:max-content}
.ch-tag{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}

.play{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--accent);transition:transform .12s ease,background .12s ease}
.play:hover{background:var(--accent-soft)}
.play:active{transform:scale(.94)}
.play svg{width:18px;height:18px}
.play.sm{width:30px;height:30px;margin-top:3px}
.play.sm svg{width:15px;height:15px}
.play.loading{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.play.playing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.star{position:absolute;top:12px;right:12px;border:0;background:none;padding:6px;color:var(--line);line-height:0}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--star)}
.star:hover{color:var(--star)}

.conceal{cursor:pointer;border-radius:6px;position:relative}
.hide-py .py.conceal:not(.shown),.hide-mean .mean.conceal:not(.shown),.hide-mean .ex-en.conceal:not(.shown){color:transparent;background:var(--surface-2);user-select:none}
.hide-py .py.conceal:not(.shown) span{color:transparent}
.hide-py .py.conceal:not(.shown)::after,.hide-mean .mean.conceal:not(.shown)::after{content:"tap to show";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;margin-top:14px}

/* ---------- flashcards ---------- */
.fc-wrap{margin-top:18px;display:grid;gap:14px;justify-items:center}
.fc-count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.fc-bar{width:100%;max-width:640px;height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--accent);transition:width .2s ease}
.card{width:100%;max-width:640px;min-height:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;position:relative}
.card .hz{font-size:clamp(52px,11vw,84px)}
.card .py{font-size:24px}
.card .mean{font-size:19px}
.card .ex{font-size:19px}
.card .hint{color:var(--muted);font-size:13px;letter-spacing:.04em}
.card .back{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card .divider{width:48px;height:2px;background:var(--line);border-radius:2px;margin:6px 0}
.card .ex-row{justify-content:center;text-align:left}
.fc-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.05)}
.kbd{font-size:12px;color:var(--muted)}
.kbd kbd{font-family:var(--ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}


/* ---------- character breakdown ---------- */
:root{--p0:#0C7560;--p1:#B8620B;--p2:#3B5FC0;--p3:#8B3FA8;--grid:#C9D3CD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--p0:#40C3A1;--p1:#F0A24A;--p2:#86A8FF;--p3:#D08BEA;--grid:#34423D}}
:root[data-theme="dark"]{--p0:#40C3A1;--p1:#F0A24A;--p2:#86A8FF;--p3:#D08BEA;--grid:#34423D}
.parts-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 10px;font-size:13.5px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:6px;width:max-content;margin-top:6px}
.parts-btn .zi{font-family:var(--hanzi);font-size:15px}
.parts-btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.breakdown{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:10px;padding-top:14px;border-top:1px dashed var(--line)}
.zi-card{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.zi-box{display:flex;flex-direction:column;gap:6px;align-items:center}
.zi-svg{width:112px;height:112px;background:var(--surface);border:1.5px solid var(--grid);border-radius:4px;display:block}
.zi-svg .gl{stroke:var(--grid);stroke-width:6;stroke-dasharray:24 18;fill:none}
.zi-svg path.st{fill:var(--muted);transition:opacity .15s ease}
.zi-svg path.c0{fill:var(--p0)}.zi-svg path.c1{fill:var(--p1)}.zi-svg path.c2{fill:var(--p2)}.zi-svg path.c3{fill:var(--p3)}
.zi-svg.anim path.st{opacity:.12}
.zi-svg.anim path.st.on{opacity:1}
.stroke-btn{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:700;padding:2px 4px}
.zi-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.zi-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.zi-head .zi-py{font-weight:700;font-size:17px}
.zi-head .zi-n{font-size:12px;color:var(--muted)}
.zi-def{font-size:14.5px;color:var(--ink)}
.zi-row{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zi-row b{color:var(--ink);font-weight:700}
.part{display:inline-flex;align-items:center;gap:6px;border:1.5px solid currentColor;border-radius:8px;padding:2px 8px 2px 6px;font-size:13px;max-width:100%}
.part .pz{font-family:var(--hanzi);font-size:19px;font-weight:700;line-height:1.2}
.part .pm{color:var(--ink);overflow-wrap:anywhere}
.part.c0{color:var(--p0)}.part.c1{color:var(--p1)}.part.c2{color:var(--p2)}.part.c3{color:var(--p3)}
.part .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.9}
.plus{color:var(--muted);font-weight:700}
.rad{display:inline-flex;align-items:center;gap:6px}
.rad .pz{font-family:var(--hanzi);font-size:19px;font-weight:700;color:var(--ink)}
.clue{font-size:13.5px;color:var(--muted);background:var(--surface);border-radius:8px;padding:6px 9px}
.clue b{color:var(--ink)}
.card .breakdown{text-align:left;width:100%}
.card-parts{width:100%;max-width:640px}
.card-parts .breakdown{border-top:0;margin-top:0;padding-top:0;grid-template-columns:1fr}



/* ---------- synonyms ---------- */
.syn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.syn-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.syn-label .zh{font-family:var(--zh);letter-spacing:0;text-transform:none;font-size:13px}
.syn-chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--ink);line-height:1.4}
.syn-chip .sz{font-family:var(--zh);font-size:16px;font-weight:600}
.syn-chip .sp{color:var(--muted);font-size:12.5px}
button.syn-chip{cursor:pointer;border-color:var(--accent-soft);background:var(--accent-soft)}
button.syn-chip .sz{color:var(--accent)}
button.syn-chip:hover{border-color:var(--accent)}
.hide-py .syn-chip .sp{visibility:hidden}
.card .syn{justify-content:center}
.word.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- radicals view ---------- */
.rad-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.rad-bar .hint{color:var(--muted);font-size:14px}
.rad-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;margin-top:14px;align-items:start}
.rad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rad-tile{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px 8px;text-align:center;min-width:0}
.rad-tile:hover{border-color:var(--accent)}
.rad-tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rad-tile[aria-pressed="true"] .rt-m,.rad-tile[aria-pressed="true"] .rt-n{color:var(--accent-ink);opacity:.85}
.rt-z{font-family:var(--hanzi);font-size:30px;font-weight:700;line-height:1.15}
.rt-m{font-size:12px;color:var(--muted);line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-n{font-size:11.5px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.rad-detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbh,140px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - var(--tbh,140px) - 32px);overflow-y:auto;box-shadow:var(--shadow)}
.rd-back{display:none;border:0;background:none;color:var(--accent);font-weight:700;padding:0 0 10px;font-size:14px}
.rd-head{display:flex;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.rd-z{font-family:var(--hanzi);font-size:56px;font-weight:700;line-height:1;width:76px;height:76px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.rd-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.rd-t b{font-size:18px}
.rd-t span{color:var(--muted);font-size:14px}
.rd-var{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.rd-var button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:1px 8px;font-family:var(--hanzi);font-size:17px;color:var(--accent)}
.rd-list{display:grid;gap:10px;margin-top:12px}
.rc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.rc-top{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.rc-z{font-family:var(--hanzi);font-size:32px;font-weight:700;line-height:1.1;flex:none}
.rc-i{display:flex;flex-direction:column;min-width:0;flex:1}
.rc-i .py{font-size:15px}
.rc-i .d{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-more{font-size:12.5px;font-weight:700;color:var(--accent);flex:none}
.rc-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.wchip .wz{font-family:var(--zh);font-size:15px;font-weight:600;color:var(--ink)}
.wchip .wz mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.wchip:hover{border-color:var(--accent)}
.rc .breakdown{grid-template-columns:1fr;border-top:1px dashed var(--line)}
.rad-empty{color:var(--muted);text-align:center;padding:30px 10px}
button.rad{border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:8px;padding:1px 8px 1px 5px;color:var(--ink);font-size:inherit;cursor:pointer}
button.rad:hover{border-color:var(--accent)}
button.rad .go{color:var(--accent);font-weight:700;font-size:12px}

/* ---------- readings: black & white document ---------- */
.reader{--paper:#ffffff;--ink-k:#111111;--grey-k:#6b6b6b;--rule-k:#1a1a1a;--soft-k:#e6e6e6;--desk:#d9d9d9;
  background:var(--desk);border-radius:6px;padding:28px clamp(10px,3vw,40px) 40px;margin-top:16px;color:var(--ink-k)}
.rd-tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;max-width:794px;margin:0 auto 14px;font-family:"Source Serif 4",Georgia,serif;font-size:14px;color:#333}

<script>
const DATA = __DATA__;

/* ---------- state ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mwb-'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mwb-'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  ch: store.get('ch', DATA[0].id),
  view: store.get('view', 'list'),
  showPy: true, showMean: true,
  showExt: store.get('ext', true),
  slow: store.get('slow', false),
  q: '',
  stars: new Set(store.get('stars', [])),
  order: [], idx: 0, flipped: false, cardParts: false, rdPy: store.get('rdPy', false), rdLines: store.get('rdLines', true),
  rad: null, radPicked: false, radScope: store.get('radScope', 'all'), radOpen: new Set()
};
const hashCh = decodeURIComponent(location.hash.slice(1));
if (hashCh && (hashCh === 'starred' || DATA.some(c => c.id === hashCh))) S.ch = hashCh;
if (S.ch !== 'starred' && !DATA.some(c => c.id === S.ch)) S.ch = DATA[0].id;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyOf = (c, w) => c + '|' + w.w;

/* ---------- pinyin tones ---------- */
const TONE = {};
[['āēīōūǖĀĒĪŌŪǕ',1],['áéíóúǘÁÉÍÓÚǗ',2],['ǎěǐǒǔǚǍĚǏǑǓǙ',3],['àèìòùǜÀÈÌÒÙǛ',4]].forEach(([s,t]) => [...s].forEach(ch => TONE[ch]=t));
function toneOf(syl){ for (const ch of syl) if (TONE[ch]) return TONE[ch]; return 5; }
function pinyinHTML(p){
  return p.split(/(\s+|\/|…)/).map(tok => {
    if (!tok || /^\s+$/.test(tok) || tok === '/' || tok === '…') return esc(tok);
    // split fused syllables like "jì…yòu" already handled; colour whole token
    return `<span class="t${toneOf(tok)}">${esc(tok)}</span>`;
  }).join('');
}

/* ---------- highlight word in sentence ---------- */
function highlight(sentence, word){
  const parts = word.split('…').filter(Boolean).sort((a,b)=>b.length-a.length);
  let html = esc(sentence);
  for (const p of parts){
    const e = esc(p);
    if (html.includes(e)) html = html.split(e).join('\u0001' + e + '\u0002');
  }
  return html.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
}

/* ---------- audio: recorded clips (one audio file per chapter), device voice as backup ---------- */
const AIDX = __AUDIOIDX__;
const AUD = { ctx:null, buf:{}, load:{}, src:null, btn:null, failed:{} };
function actx(){
  if (!AUD.ctx){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    AUD.ctx = new C();
  }
  return AUD.ctx;
}
function loadChapterAudio(id){
  if (AUD.buf[id]) return Promise.resolve(AUD.buf[id]);
  if (!AUD.load[id]){
    const ctx = actx();
    AUD.load[id] = (ctx ? fetch('audio/' + id + '.mp3') : Promise.reject(new Error('no audio')))
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)))
      .then(b => (AUD.buf[id] = b))
      .catch(err => { AUD.failed[id] = true; delete AUD.load[id]; throw err; });
  }
  return AUD.load[id];
}
function stopAudio(){
  if (AUD.src){ try{ AUD.src.onended = null; AUD.src.stop(); }catch(e){} AUD.src = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.play.playing,.play.loading').forEach(b => b.classList.remove('playing','loading'));
}
function playClip(btn){
  const xk = btn.dataset.x, ch = xk ? 'x' : btn.dataset.ch, i = +btn.dataset.i, kind = +btn.dataset.kind;   // kind 0 = word, 2 = sentence; +1 = slow
  if (PA && !PA.paused) PA.pause();
  const wasMe = AUD.btn === btn && btn.classList.contains('playing');
  stopAudio(); AUD.btn = btn;
  if (wasMe) return;                                  // second tap stops
  const ctx = actx();
  if (ctx && ctx.state === 'suspended') ctx.resume();
  btn.classList.add('loading');
  loadChapterAudio(ch).then(buf => {
    if (AUD.btn !== btn) return;
    const [off, dur] = xk ? AIDX.x[xk][S.slow ? 1 : 0] : AIDX[ch][i][kind + (S.slow ? 1 : 0)];
    const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination);
    s.onended = () => { btn.classList.remove('playing'); if (AUD.src === s) AUD.src = null; };
    btn.classList.remove('loading'); btn.classList.add('playing');
    s.start(0, Math.max(0, off - 0.02), dur + 0.08); AUD.src = s;
  }).catch(() => { btn.classList.remove('loading'); if (AUD.btn === btn) speakBackup(btn.dataset.say, btn); });
}
function speakBackup(text, btn){
  if (!('speechSynthesis' in window)){ showAudioNote(); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/…/g, '，'));

          <div class="mean">${esc(w.m)}</div>
          <div class="divider"></div>
          <div class="ex-row"><button class="play sm" ${playAttrs(c, w, 2, w.s)} aria-label="Play example sentence">${ICON_PLAY}</button><div class="ex" lang="zh-CN">${highlight(w.s, w.w)}</div></div>
          <div class="ex-en">${esc(w.t)}</div>
          ${synHTML(w)}
        </div>` : `<div class="hint">Say it, then tap the card to check</div>`}
    </div>
    <div class="fc-controls">
      <button class="btn" id="fcPrev">← Previous</button>
      <button class="btn primary" id="fcFlip">${S.flipped ? 'Hide answer' : 'Show answer'}</button>
      <button class="btn" id="fcNext">Next →</button>
      <button class="btn" id="fcShuffle">Shuffle</button>
      <button class="btn" id="fcParts" aria-pressed="${S.cardParts}"><span style="font-family:var(--hanzi)">字</span> ${S.cardParts ? 'Hide' : 'Show'} character parts</button>
    </div>
    ${S.cardParts ? `<div class="card-parts">${breakdownHTML(w.w)}</div>` : ''}
    <div class="kbd"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>P</kbd> play</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const rows = wordsFor();
  document.body.classList.toggle('hide-py', !S.showPy);
  document.body.classList.toggle('hide-mean', !S.showMean);
  renderNav(); renderHead(rows);
  $('vList').setAttribute('aria-pressed', S.view === 'list');
  $('vCards').setAttribute('aria-pressed', S.view === 'cards');
  $('vRad').setAttribute('aria-pressed', S.view === 'rad');
  $('vRead').setAttribute('aria-pressed', S.view === 'read');
  ['vQuiz','quiz','vPat','pat','vPh','ph'].reduce((a,x,i,arr)=>{ if(i%2===0) $(x).setAttribute('aria-pressed', S.view === arr[i+1]); return a; },0);
  $('tPy').setAttribute('aria-pressed', S.showPy);
  $('tMean').setAttribute('aria-pressed', S.showMean);
  $('tExt').setAttribute('aria-pressed', S.showExt);
  $('sNorm').setAttribute('aria-pressed', !S.slow);
  $('sSlow').setAttribute('aria-pressed', S.slow);
  $('tPy').disabled = $('tMean').disabled = S.view !== 'list';
  $('tPy').style.opacity = $('tMean').style.opacity = S.view !== 'list' ? .45 : 1;
  hidePop();
  if (S.view === 'pat' || S.view === 'ph') loadChapterAudio('x').catch(() => {});
  if (S.view === 'quiz') renderQuiz(); else if (S.view === 'pat') renderPatterns(); else if (S.view === 'ph') renderPhrases(); else if (S.view === 'read') renderReading(); else if (S.view === 'rad') renderRadicals(); else if (S.view === 'cards') renderCards(rows); else renderList(rows);
  preloadAudio();
}
function goChapter(id){
  if (QZ.run && S.view === 'quiz') QZ.run = null;
  if (PA && !PA.paused) PA.pause();
  S.ch = id; S.q = ''; $('q').value = ''; store.set('ch', id); resetDeck([]); S.order = [];
  try{ history.replaceState(null, '', '#' + id); }catch(e){}
  render(); window.scrollTo({top:0});
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const play = e.target.closest('.play');
  if (play){ e.stopPropagation(); playClip(play); return; }
  const star = e.target.closest('.star');
  if (star){
    e.stopPropagation();
    const k = star.dataset.k || star.closest('.word').dataset.k;
    S.stars.has(k) ? S.stars.delete(k) : S.stars.add(k);
    store.set('stars', [...S.stars]);
    star.setAttribute('aria-pressed', S.stars.has(k));
    renderNav();
    if (S.ch === 'starred' && S.view === 'list' && !S.q) render();
    return;
  }
  const sb = e.target.closest('[data-stroke]');
  if (sb){ e.stopPropagation(); animateStrokes(sb); return; }
  const pb = e.target.closest('[data-parts]');
  if (pb){
    const art = pb.closest('.word'), k = art.dataset.k;
    if (OPEN.has(k)){ OPEN.delete(k); art.querySelector('.breakdown')?.remove(); pb.setAttribute('aria-expanded','false'); }
    else { OPEN.add(k); art.insertAdjacentHTML('beforeend', breakdownHTML(k.split('|')[1])); pb.setAttribute('aria-expanded','true'); }
    return;
  }
  if (e.target.closest('#fcParts')){ S.cardParts = !S.cardParts; render(); return; }
  if (e.target.closest('.card-parts')) return;
  const pp = e.target.closest('[data-paplay]');
  if (pp){ paToggle(pp.closest('.pa').dataset.pa); return; }
  const prt = e.target.closest('[data-parate]');
  if (prt){ const key = prt.closest('.pa').dataset.pa; if (paKey !== key) paToggle(key); const r = [1, 0.8, 0.6]; PA.playbackRate = r[(r.indexOf(PA.playbackRate) + 1) % r.length]; paSync(); return; }
  const psk = e.target.closest('[data-paseek]');
  if (psk){ const key = psk.closest('.pa').dataset.pa; const f = (e.clientX - psk.getBoundingClientRect().left) / psk.offsetWidth; if (paKey !== key) paToggle(key); const go = () => { PA.currentTime = f * (PA.duration || PDUR[key]); }; PA.readyState ? go() : PA.addEventListener('loadedmetadata', go, {once:true}); return; }
  const qa = e.target.closest('[data-qa]');
  if (qa){ const [i, v] = qa.dataset.qa.split('|'); qAnswer(qa.closest('.qz').dataset.qz, +i, v); return; }
  const qen = e.target.closest('[data-qen]');
  if (qen){ const key = qen.closest('.qz').dataset.qz; QEN.has(key) ? QEN.delete(key) : QEN.add(key); qen.closest('.qz').outerHTML = qzHTML(key); return; }
  const qzs = e.target.closest('[data-qzs]'); if (qzs){ QZ.scope = qzs.dataset.qzs; store.set('qzScope', QZ.scope); renderQuiz(); return; }
  const qzt = e.target.closest('[data-qzt]'); if (qzt){ QZ.type = qzt.dataset.qzt; store.set('qzType', QZ.type); renderQuiz(); return; }
  const qzn = e.target.closest('[data-qzn]'); if (qzn){ QZ.n = +qzn.dataset.qzn; store.set('qzN', QZ.n); renderQuiz(); return; }
  if (e.target.closest('[data-qzgo]')){ startQuiz(); return; }
  if (e.target.closest('[data-qzretry]')){ startQuiz(QZ.run.missed.slice()); return; }
  if (e.target.closest('[data-qzback]') || e.target.closest('[data-qzquit]')){ QZ.run = null; renderQuiz(); return; }
  const qzp = e.target.closest('[data-qzpick]'); if (qzp){ quizPick(+qzp.dataset.qzpick); return; }
  if (e.target.closest('[data-qznext]')){ QZ.run.idx++; renderQuiz(); autoPlayQ(); window.scrollTo({top: Math.min(window.scrollY, document.getElementById('view').offsetTop - 20)}); return; }
  const pg = e.target.closest('[data-patgo]'); if (pg){ document.getElementById('pat-' + pg.dataset.patgo).scrollIntoView({block:'start'}); return; }
  const phg = e.target.closest('[data-phgo]'); if (phg){ document.getElementById('ph-' + phg.dataset.phgo).scrollIntoView({block:'start'}); return; }
  if (e.target.closest('[data-phhide]')){ S.phHide = !S.phHide; renderPhrases(); return; }
  const phe = e.target.closest('.ph-hide .ph .en'); if (phe){ phe.classList.toggle('shown'); return; }
  const vw = e.target.closest('.vw');
  if (vw){ e.stopPropagation(); popFor === vw && !canHover ? hidePop() : showPop(vw); return; }
  if (e.target.closest('[data-popx]')){ hidePop(); return; }
  const ro = e.target.closest('[data-rdopt]');
  if (ro){ if (ro.dataset.rdopt === 'py'){ S.rdPy = !S.rdPy; store.set('rdPy', S.rdPy); } else { S.rdLines = !S.rdLines; store.set('rdLines', S.rdLines); } render(); return; }
  const cg = e.target.closest('[data-ch-go]');
  if (cg){ goChapter(cg.dataset.chGo); return; }
  if (POP && !e.target.closest('.pop')) hidePop();
  const jb = e.target.closest('[data-jump]');
  if (jb){ e.stopPropagation(); const [cid, i] = jb.dataset.jump.split('|'); jumpToWord(cid, +i); return; }
  const rb = e.target.closest('[data-rad]');
  if (rb){ e.stopPropagation(); openRadical(rb.dataset.rad); return; }
  if (e.target.closest('[data-radback]')){ S.radPicked = false; renderRadicals(); window.scrollTo({top: Math.max(0, (document.querySelector('.rad-layout')?.offsetTop || 0) - 8)}); return; }
  const rs = e.target.closest('[data-radscope]');
  if (rs){ S.radScope = rs.dataset.radscope; store.set('radScope', S.radScope); render(); return; }
  const rcb = e.target.closest('[data-rc]');
  if (rcb){ const z = rcb.dataset.rc; S.radOpen.has(z) ? S.radOpen.delete(z) : S.radOpen.add(z); renderRadicals(true); return; }
  const ch = e.target.closest('.ch-btn');
  if (ch){ goChapter(ch.dataset.ch); return; }
  const con = e.target.closest('.conceal');
  if (con && ((con.classList.contains('py') && !S.showPy) || (!con.classList.contains('py') && !S.showMean))){ con.classList.toggle('shown'); return; }
  if (e.target.closest('#card') || e.target.id === 'fcFlip'){ S.flipped = !S.flipped; render(); return; }
  if (e.target.id === 'fcNext') return move(1);
  if (e.target.id === 'fcPrev') return move(-1);
  if (e.target.id === 'fcShuffle'){
    const a = S.order; for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    S.idx = 0; S.flipped = false; render();
  }
});
function move(d){
  const n = S.order.length; if (!n) return;
  S.idx = (S.idx + d + n) % n; S.flipped = false; render();
}
document.addEventListener('keydown', e => {
  if (S.view !== 'cards' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight'){ move(1); }
  else if (e.key === 'ArrowLeft'){ move(-1); }
  else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); S.flipped = !S.flipped; render(); }
  else if (e.key.toLowerCase() === 'p'){ const b = document.querySelector('#card .play'); if (b) playClip(b); }
});
$('chSelect').addEventListener('change', e => goChapter(e.target.value));
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); S.order = []; render(); }, 150); });
$('vList').onclick = () => { S.view = 'list'; store.set('view','list'); render(); };
$('vCards').onclick = () => { S.view = 'cards'; store.set('view','cards'); S.order = []; render(); };
['vQuiz:quiz','vPat:pat','vPh:ph'].forEach(s => { const [b, v] = s.split(':'); $(b).onclick = () => { S.view = v; store.set('view', v); render(); window.scrollTo({top:0}); }; });
$('vRead').onclick = () => { S.view = 'read'; store.set('view','read'); render(); window.scrollTo({top:0}); };
$('vRad').onclick = () => { S.view = 'rad'; store.set('view','rad'); render(); };
$('tPy').onclick = () => { S.showPy = !S.showPy; document.querySelectorAll('.shown').forEach(x=>x.classList.remove('shown')); render(); };
$('tMean').onclick = () => { S.showMean = !S.showMean; document.querySelectorAll('.shown').forEach(x=>x.classList.remove('shown')); render(); };
$('tExt').onclick = () => { S.showExt = !S.showExt; store.set('ext', S.showExt); S.order = []; render(); };
$('sNorm').onclick = () => { S.slow = false; store.set('slow', false); render(); };
$('sSlow').onclick = () => { S.slow = true; store.set('slow', true); render(); };

render();
</script>
